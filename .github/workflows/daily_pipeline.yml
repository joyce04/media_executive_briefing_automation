name: Daily Media Briefing Pipeline

on:
  schedule:
    # 05:40 KST daily = 20:40 UTC previous day
    - cron: "40 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date (YYYY-MM-DD). Leave blank for today KST."
        required: false
        default: ""
      dry_run:
        description: "Skip email delivery (dry run)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # required to commit DB and reports back to the repo
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      KFA_EMAIL_TO_1: ${{ secrets.KFA_EMAIL_TO_1 }}
      KFA_EMAIL_CC_1: ${{ secrets.KFA_EMAIL_CC_1 }}
      KFA_EMAIL_BCC_1: ${{ secrets.KFA_EMAIL_BCC_1 }}
      DATABASE_PATH: ./data/kfa_intel.db
      REPORTS_OUTPUT_DIR: ./reports/
      TIMEZONE: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Initialise database
        # data/ is checked out from the repo and contains the previous DB.
        # kfa-init-db is idempotent — only creates tables that are missing.
        run: uv run kfa-init-db

      - name: Run pipeline
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          uv run kfa-pipeline $ARGS

      - name: Commit and push outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.db reports/*.html
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "chore: pipeline run $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase origin main
              git push && break
              sleep 5
            done
          fi
